<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Gaming Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #050816 0%, #0b1120 50%, #050816 100%);
            color: #e2e8f0;
        }
        
        .header {
            background: rgba(5, 8, 22, 0.9);
            padding: 20px 0;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.3rem;
            text-decoration: none;
            color: #e2e8f0;
        }
        
        .brand img {
            width: 30px;
            height: 30px;
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #a5b4cf;
            transition: color 0.2s;
        }
        
        .nav-links a:hover {
            color: #e2e8f0;
        }
        
        .hero {
            padding: 80px 0;
            text-align: center;
        }
        
        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        
        .gradient {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .lead {
            font-size: 1.1rem;
            color: #a5b4cf;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }
        
        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.15);
        }
        
        .section {
            padding: 60px 0;
        }
        
        .section h2 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 60px;
        }
        
        .game-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }
        
        .game-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(96, 165, 250, 0.1);
        }
        
        .game-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .game-card h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        
        .game-card p {
            color: #a5b4cf;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .footer {
            padding: 30px 0;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            text-align: center;
            color: #a5b4cf;
        }
        
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 22, 0.95);
            z-index: 100;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .game-modal.active {
            display: flex;
        }
        
        .game-modal canvas {
            border: 2px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            background: #050816;
            margin-bottom: 20px;
        }
        
        .close-btn {
            margin-top: 20px;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }*
