<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova SVG Studio - Gaming Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #050816 0%, #0b1120 50%, #050816 100%);
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px);
            background: rgba(5, 8, 22, 0.55);
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        }

        .nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-decoration: none;
            color: #e2e8f0;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(96, 165, 250, 0.1);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .brand-icon img {
            width: 18px;
            height: 18px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            color: #a5b4cf;
        }

        .nav-links a {
            text-decoration: none;
            color: inherit;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #e2e8f0;
        }

        .nav-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            color: white;
            box-shadow: 0 20px 35px rgba(96, 165, 250, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 45px rgba(96, 165, 250, 0.3);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.04);
            border: 1px solid rgba(148, 163, 184, 0.14);
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.08);
        }

        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 64px 16px 48px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 34px;
            align-items: center;
        }

        .hero-content h1 {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -0.07em;
        }

        .gradient-text {
            background: linear-gradient(135deg, #dbeafe, #93c5fd, #c4b5fd, #f0abfc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: rgba(96, 165, 250, 0.08);
            border: 1px solid rgba(96, 165, 250, 0.18);
            color: #bfe1ff;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 18px;
        }

        .eyebrow::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 18px rgba(52, 211, 153, 0.8);
            margin-right: 4px;
        }

        .hero-content p {
            color: #a5b4cf;
            font-size: 1.07rem;
            line-height: 1.75;
            margin-bottom: 26px;
            max-width: 620px;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            margin-bottom: 26px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat {
            min-width: 130px;
        }

        .stat strong {
            display: block;
            font-size: 1.7rem;
            letter-spacing: -0.05em;
        }

        .stat span {
            color: #a5b4cf;
            font-size: 0.78rem;
        }

        .hero-visual {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 600px;
        }

        .panel {
            width: 100%;
            max-width: 560px;
            padding: 20px;
            border-radius: 30px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.15);
            box-shadow: 0 30px 80px rgba(2, 6, 23, 0.6);
        }

        .panel-inner {
            padding: 12px;
            border-radius: 22px;
            background: rgba(2, 6, 23, 0.86);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px 14px;
            color: #a5b4cf;
            font-size: 0.8rem;
        }

        .dots {
            display: flex;
            gap: 8px;
        }

        .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .dots span:nth-child(1) { background: #f87171; }
        .dots span:nth-child(2) { background: #fbbf24; }
        .dots span:nth-child(3) { background: #34d399; }

        .logo-stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 360px;
            border-radius: 24px;
            background: radial-gradient(circle at center, rgba(96, 165, 250, 0.2), transparent 38%),
                        linear-gradient(180deg, rgba(148, 163, 184, 0.02), rgba(15, 23, 42, 0.4));
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .main-logo {
            width: 280px;
            filter: drop-shadow(0 18px 32px rgba(96, 165, 250, 0.3));
            animation: floaty 5s ease-in-out infinite;
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.08);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.46rem 0.7rem;
            border-radius: 999px;
            background: rgba(52, 211, 153, 0.12);
            color: #a7f3d0;
            border: 1px solid rgba(52, 211, 153, 0.18);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 88px 16px;
        }

        .section-header h2 {
            font-size: 3rem;
            margin: 12px 0 14px;
            letter-spacing: -0.06em;
        }

        .section-header p {
            color: #a5b4cf;
            font-size: 1.04rem;
            line-height: 1.7;
            max-width: 700px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 28px;
        }

        .game-item {
            padding: 20px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.45));
            border: 1px solid rgba(148, 163, 184, 0.12);
            cursor: pointer;
            transition: 0.3s;
        }

        .game-item:hover {
            border-color: rgba(96, 165, 250, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(96, 165, 250, 0.15);
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 14px;
        }

        .game-item h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .game-item p {
            color: #a5b4cf;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 14px;
        }
